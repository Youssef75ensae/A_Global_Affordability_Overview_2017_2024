# Copy to secret.yaml, fill values, apply with kubectl (never commit real credentials).
# kubectl apply -f secret.yaml -n affordability
apiVersion: v1
kind: Secret
metadata:
  name: affordability-pipeline-secrets
  namespace: affordability
type: Opaque
stringData:
  KAGGLE_USERNAME: "replace-me"
  KAGGLE_KEY: "replace-me"
  AWS_ACCESS_KEY_ID: "replace-me"
  AWS_SECRET_ACCESS_KEY: "replace-me"
  # DuckDB httpfs (no https:// prefix; see src/data/utils.py)
  AWS_S3_ENDPOINT: "minio.example.com"
  MY_BUCKET: "your-bucket-name"
